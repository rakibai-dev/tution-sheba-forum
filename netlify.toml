[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/tuitions"
  to = "/.netlify/functions/tuitions"
  status = 200
  force = true

[[redirects]]
  from = "/api/teachers"
  to = "/.netlify/functions/teachers"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
